# Builds BEARINGS and publishes it to GitHub Pages on every push.
#
# In the repository: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The build reads the site's public path from Pages itself,
# so the site works whether it is served from a domain root or from /bearings/.
name: Publish

on:
  push:
    branches:
      - main
      - claude/bearings-editorial-website-r16gvp
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: node build.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
